name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "$JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java 17 or higher is required. Found: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified successfully (Java $JAVA_MAJOR)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Debug keystore not found at $KEYSTORE_PATH. Generating temporary keystore..."
            keytool -genkey -v -keystore "$KEYSTORE_PATH" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Temporary debug keystore created successfully."
          else
            echo "Debug keystore already exists at $KEYSTORE_PATH."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        id: verify_apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Debug APK not found at $APK_PATH"
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: Debug APK is empty (0 bytes) at $APK_PATH"
            exit 1
          fi
          case "$APK_PATH" in
            *.apk) echo "APK verified: $APK_PATH ($(stat -c%s "$APK_PATH") bytes)" ;;
            *) echo "Error: $APK_PATH does not have .apk extension"; exit 1 ;;
          esac
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_DIR="${{ runner.temp }}/release-asset"
          mkdir -p "$RELEASE_DIR"
          RELEASE_APK="$RELEASE_DIR/app-debug.apk"
          cp "$SRC_APK" "$RELEASE_APK"
          if [ ! -f "$RELEASE_APK" ]; then
            echo "Error: Failed to prepare release asset at $RELEASE_APK"
            exit 1
          fi
          echo "Release asset prepared: $RELEASE_APK"
          echo "asset_path=$RELEASE_APK" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"
          ASSET_FILE="${{ steps.prep_asset.outputs.asset_path }}"

          NOTES_BODY="### Debug APK Build #${{ github.run_number }}
          - Commit: \`${{ github.sha }}\`
          - Run Attempt: \`${{ github.run_attempt }}\`
          - Direct download: [app-debug.apk](https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk)
          "

          echo "Creating release $RELEASE_TAG with asset $ASSET_FILE..."
          gh release create "$RELEASE_TAG" "$ASSET_FILE" \
            --title "$RELEASE_TITLE" \
            --target "$TARGET_COMMIT" \
            --latest \
            --notes "$NOTES_BODY"
          echo "Release created successfully."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATUS: ${{ steps.create_release.outcome }}
        run: |
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
          echo "=== APK DOWNLOAD REPORT ==="
          if [ "$RELEASE_STATUS" = "success" ]; then
            echo "Release created successfully. Fetching release info..."
            gh release view --json tagName,name,url,assets || true
            echo ""
            echo "DIRECT APK DOWNLOAD:"
            echo "$DIRECT_URL"
            echo "DIRECT APK DOWNLOAD: $DIRECT_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Notice: GitHub Release creation did not complete or was skipped."
            echo "The debug APK artifact ('app-debug-apk') is available in the GitHub Actions run summary."
            echo "GitHub Actions Artifact: 'app-debug-apk' was uploaded successfully." >> "$GITHUB_STEP_SUMMARY"
          fi
