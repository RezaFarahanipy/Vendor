name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "$JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Unable to detect active Java version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java 17 or higher is required. Found: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified successfully (Java $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Debug keystore already exists at $KEYSTORE_PATH."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Error: Failed to create debug keystore at $KEYSTORE_PATH."
            exit 1
          fi
          echo "Debug keystore verified successfully at $KEYSTORE_PATH."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        id: verify_apk
        run: |
          EXACT_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXACT_APK" ]; then
            echo "Error: Exact APK not found at $EXACT_APK."
            echo "Searching only inside app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            fi
            exit 1
          fi

          if [ ! -s "$EXACT_APK" ]; then
            echo "Error: $EXACT_APK is empty (0 bytes)."
            exit 1
          fi

          case "$EXACT_APK" in
            *.apk) echo "APK verified: $EXACT_APK ($(stat -c%s "$EXACT_APK") bytes)" ;;
            *) echo "Error: $EXACT_APK does not have .apk extension"; exit 1 ;;
          esac
          echo "apk_path=$EXACT_APK" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_DIR="${{ runner.temp }}/release-asset"
          mkdir -p "$TEMP_DIR"
          RELEASE_ASSET="$TEMP_DIR/app-debug.apk"
          cp "$SRC_APK" "$RELEASE_ASSET"

          if [ ! -f "$RELEASE_ASSET" ] || [ ! -s "$RELEASE_ASSET" ]; then
            echo "Error: Failed to prepare release asset at $RELEASE_ASSET."
            exit 1
          fi
          echo "Prepared release asset: $RELEASE_ASSET ($(stat -c%s "$RELEASE_ASSET") bytes)"
          echo "asset_path=$RELEASE_ASSET" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Verifying GitHub CLI ==="
          gh --version

          ASSET_FILE="${{ steps.prep_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_FILE" ]; then
            echo "Error: Prepared asset file does not exist: $ASSET_FILE"
            exit 1
          fi
          if [ ! -s "$ASSET_FILE" ]; then
            echo "Error: Prepared asset file is empty: $ASSET_FILE"
            exit 1
          fi
          case "$ASSET_FILE" in
            */app-debug.apk) echo "Asset filename confirmed: app-debug.apk" ;;
            *) echo "Error: Release asset filename must be exactly app-debug.apk"; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"

          NOTES_BODY="### Debug APK Build #${{ github.run_number }}

- **Notice**: This is an automatically generated debug APK built by GitHub Actions.
- **Workflow Run Number**: \`${{ github.run_number }}\`
- **Workflow Attempt**: \`${{ github.run_attempt }}\`
- **Source Commit SHA**: \`${{ github.sha }}\`
- **Intended Audience**: Testing and QA only.
- **Production Warning**: This APK is NOT a Google Play Store production release.
- **Signing**: Signed only with a temporary debug keystore."

          echo "Creating release $RELEASE_TAG..."
          gh release create "$RELEASE_TAG" "$ASSET_FILE" \
            --title "$RELEASE_TITLE" \
            --target "$TARGET_COMMIT" \
            --latest \
            --notes "$NOTES_BODY"
          echo "Release created successfully."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATUS: ${{ steps.create_release.outcome }}
        run: |
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
          echo "=== APK DOWNLOAD REPORT ==="
          if [ "$RELEASE_STATUS" = "success" ]; then
            echo "Release created successfully."
            gh release view --json tagName,name,url,assets
            echo ""
            echo "Release Tag: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "APK Asset: app-debug.apk"
            echo "Direct APK URL: $DIRECT_URL"
            echo ""
            echo "### DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[Download app-debug.apk]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "URL: \`$DIRECT_URL\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The GitHub Actions backup artifact \`app-debug-apk\` is also available in this run summary." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release creation did not succeed or was skipped."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK build succeeded and the GitHub Actions artifact 'app-debug-apk' was uploaded successfully."
              echo "### GitHub Actions Artifact" >> "$GITHUB_STEP_SUMMARY"
              echo "The debug APK artifact **app-debug-apk** is available in the run summary." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "APK was not generated."
            fi
          fi
