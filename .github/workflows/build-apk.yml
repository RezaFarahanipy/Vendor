name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "JAVA_HOME: ${JAVA_HOME}"
          if [ -z "${JAVA_HOME}" ]; then
            echo "Error: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: ${JAVA_VER}"
          JAVA_MAJOR=$(echo "${JAVA_VER}" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: ${JAVA_MAJOR}"

          if [ -z "${JAVA_MAJOR}" ]; then
            echo "Error: Could not detect Java major version."
            exit 1
          fi

          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "Error: Java major version is ${JAVA_MAJOR}, which is lower than 17."
            exit 1
          fi

          echo "Java environment verified successfully (Major version: ${JAVA_MAJOR})."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Existing ./debug.keystore detected."
          else
            echo "Generating temporary debug keystore..."
            "${JAVA_HOME}/bin/keytool" -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore does not exist."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "Error: Expected APK file not found at ${EXPECTED_APK}"
            echo "Searching only inside app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 4 -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "Error: APK file ${EXPECTED_APK} is empty."
            exit 1
          fi

          case "${EXPECTED_APK}" in
            *.apk) ;;
            *)
              echo "Error: ${EXPECTED_APK} does not have .apk extension."
              exit 1
              ;;
          esac

          echo "APK verified successfully: ${EXPECTED_APK} ($(stat -c%s "${EXPECTED_APK}") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_ASSET_DIR="${RUNNER_TEMP}/release-assets"
          mkdir -p "${TEMP_ASSET_DIR}"
          RELEASE_ASSET="${TEMP_ASSET_DIR}/app-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${RELEASE_ASSET}"

          if [ ! -f "${RELEASE_ASSET}" ] || [ ! -s "${RELEASE_ASSET}" ]; then
            echo "Error: Failed to prepare release asset ${RELEASE_ASSET}"
            exit 1
          fi

          echo "asset_path=${RELEASE_ASSET}" >> "$GITHUB_OUTPUT"
          echo "Release asset prepared: ${RELEASE_ASSET}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "Error: Asset does not exist or is empty at ${ASSET_PATH}"
            exit 1
          fi

          ASSET_NAME=$(basename "${ASSET_PATH}")
          if [ "${ASSET_NAME}" != "app-debug.apk" ]; then
            echo "Error: Asset name must be app-debug.apk, found: ${ASSET_NAME}"
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          cat << 'EOF' > release_notes.md
          ## VendorList Debug APK

          - **Build Type**: Automatically generated debug APK
          - **Builder**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Commit SHA**: ${{ github.sha }}
          - **Notice**: This APK is intended for testing and evaluation purposes. It is not a Play Store production release and is signed with a temporary debug keystore.
          EOF

          gh release create "${TAG_NAME}" "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "GitHub Release published successfully."
            gh release view "${TAG_NAME}" || true

            echo "### DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[Download app-debug.apk](${DIRECT_URL})" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Direct Link: \`${DIRECT_URL}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "*Note: The standard GitHub Actions artifact 'app-debug-apk' remains available as a backup.*" >> "$GITHUB_STEP_SUMMARY"

            echo "=========================================="
            echo "Release Tag: ${TAG_NAME}"
            echo "Release Asset: app-debug.apk"
            echo "Direct URL: ${DIRECT_URL}"
            echo "Backup artifact 'app-debug-apk' is also available."
            echo "=========================================="
          else
            echo "::warning::GitHub Release publishing did not succeed."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The APK build succeeded and the GitHub Actions backup artifact 'app-debug-apk' remains available."
            fi
            echo "### APK BUILD RESULT" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Release publication failed or was skipped, but the backup artifact 'app-debug-apk' is preserved in GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
          fi
